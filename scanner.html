<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح الباركود الذكي - فحص المكونات ومشتقات الخنزير | WiBo Health</title>
    <meta name="description" content="امسح باركود أي منتج غذائي في السوبرماركت واعرف فوراً هل يحتوي على خنزير أو جيلاتين أو مواد مشبوهة، مع عرض كامل للسعرات والقيم الغذائية">
    <link rel="canonical" href="https://wibohealth.com/scanner.html">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" type="image/png" href="/images/icon-192.png">
    
    <!-- Mobile Menu CSS -->
    <link rel="stylesheet" href="css/mobile-menu.css">

    <!-- مكتبة مسح الباركود بالكاميرا فائقة السرعة والدقة -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2ecc71;
            --secondary: #27ae60;
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            color: var(--text-dark);
            padding-bottom: 50px;
            transition: all 0.3s ease;
        }

        body.dark-mode {
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --card-bg: #0f3460;
            --text-dark: #ffffff;
            --text-light: #b8b8b8;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Header */
        header {
            background: var(--card-bg);
            padding: 15px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
        }

        .logo-text h1 {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .lang-btn, .theme-toggle {
            width: 42px;
            height: 42px;
            background: #f3f4f6;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-dark);
            transition: all 0.2s;
        }

        body.dark-mode .lang-btn, body.dark-mode .theme-toggle {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Scanner Box */
        .scanner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 25px;
        }

        .scanner-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .scanner-card p {
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px dashed var(--primary);
            background: #000;
        }

        .manual-input-box {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .manual-input-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-dark);
        }

        .manual-input-box button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        /* Result Card */
        .result-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            animation: slideUp 0.4s ease;
            margin-bottom: 25px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Status Banners */
        .status-badge {
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .status-safe {
            background: #d1fae5;
            color: #065f46;
            border-right: 6px solid #10b981;
        }

        .status-danger {
            background: #fee2e2;
            color: #991b1b;
            border-right: 6px solid #ef4444;
        }

        .status-warning {
            background: #fef3c7;
            color: #92400e;
            border-right: 6px solid #f59e0b;
        }

        .product-meta {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .product-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 12px;
            background: #f8f9fa;
            border: 1px solid #e5e7eb;
        }

        .product-info h3 {
            font-size: 1.4rem;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .product-brand {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .nutri-box {
            background: rgba(0,0,0,0.03);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        body.dark-mode .nutri-box {
            background: rgba(255,255,255,0.05);
        }

        .nutri-box small {
            display: block;
            color: var(--text-light);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .nutri-box strong {
            font-size: 16px;
            color: var(--text-dark);
        }

        .ingredients-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.02);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
            border: 1px solid #ecf0f1;
        }

        body.dark-mode .ingredients-box {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.1);
        }

        .highlight-danger {
            background: #fecaca;
            color: #991b1b;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .highlight-warning {
            background: #fde68a;
            color: #92400e;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .loading-spinner {
            display: none;
            padding: 30px;
            text-align: center;
            font-size: 20px;
            color: white;
            font-weight: bold;
        }

        .loading-spinner i {
            font-size: 35px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
            display: block;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src="/images/icon-192.png" alt="WiBo" class="logo-icon" onerror="this.style.display='none'">
                    <div class="logo-text">
                        <h1>WiBo Health</h1>
                    </div>
                </a>

                <div class="header-actions">
                    <button class="lang-btn" data-lang-toggle="ar" onclick="switchLanguage('ar')" title="العربية">🇪🇬</button>
                    <button class="lang-btn" data-lang-toggle="en" onclick="switchLanguage('en')" title="English">🇬🇧</button>
                    <button class="theme-toggle" onclick="toggleTheme()" title="Theme"><i class="fas fa-moon"></i></button>
                    <a href="index.html" style="background: var(--primary); color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: bold;">
                        <i class="fas fa-home"></i> <span data-i18n="home">الرئيسية</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Scanner Card -->
        <div class="scanner-card">
            <h2><i class="fas fa-barcode"></i> <span data-i18n="title">ماسح الباركود وفحص الحلال</span></h2>
            <p data-i18n="subtitle">وجه كاميرا الهاتف نحو باركود المنتج لمعرفة مكوناته وهل يحتوي على خنزير أو مواد مشبوهة</p>

            <!-- منطقة الكاميرا -->
            <div id="reader"></div>

            <!-- زر تشغيل/إيقاف الكاميرا -->
            <button id="toggleCameraBtn" onclick="toggleCamera()" style="
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                color: white; border: none; padding: 12px 25px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; font-family: inherit;">
                <i class="fas fa-camera"></i> <span id="cameraBtnText">تشغيل الكاميرا</span>
            </button>

            <!-- إدخال يدوي في حال تعذر تشغيل الكاميرا -->
            <div class="manual-input-box">
                <input type="text" id="manualBarcodeInput" placeholder="أو اكتب رقم الباركود هنا (مثال: 8710400...)" inputmode="numeric">
                <button onclick="fetchProductData(document.getElementById('manualBarcodeInput').value)"><i class="fas fa-search"></i> <span data-i18n="search">فحص</span></button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading-spinner" id="loadingSpinner">
            <i class="fas fa-spinner"></i>
            <span data-i18n="loading">جاري فحص المنتج في قاعدة البيانات العالمية...</span>
        </div>

        <!-- Result Card -->
        <div class="result-card" id="resultCard">
            <!-- حالة الحلال ومشتقات الخنزير -->
            <div class="status-badge" id="statusBadge"></div>

            <!-- معلومات المنتج -->
            <div class="product-meta">
                <img id="productImg" src="" alt="Product" class="product-img">
                <div class="product-info">
                    <h3 id="productTitle"></h3>
                    <p class="product-brand" id="productBrand"></p>
                    <p id="barcodeNumber" style="font-size: 13px; color: var(--text-light); margin-top: 4px;"></p>
                </div>
            </div>

            <!-- شبكة السعرات والمكونات الغذائية لكل 100 غرام -->
            <h4 style="margin-top: 15px; color: var(--text-dark); font-size: 16px;" data-i18n="nutrition_title">📊 القيم الغذائية (لكل 100 غرام):</h4>
            <div class="nutrition-grid">
                <div class="nutri-box">
                    <small data-i18n="energy">السعرات</small>
                    <strong id="nutriCalories">-</strong>
                </div>
                <div class="nutri-box">
                    <small data-i18n="protein">بروتين</small>
                    <strong id="nutriProtein">-</strong>
                </div>
                <div class="nutri-box">
                    <small data-i18n="carbs">كربوهيدرات</small>
                    <strong id="nutriCarbs">-</strong>
                </div>
                <div class="nutri-box">
                    <small data-i18n="sugars">سكر</small>
                    <strong id="nutriSugars">-</strong>
                </div>
                <div class="nutri-box">
                    <small data-i18n="fat">دهون</small>
                    <strong id="nutriFat">-</strong>
                </div>
                <div class="nutri-box">
                    <small data-i18n="salt">ملح</small>
                    <strong id="nutriSalt">-</strong>
                </div>
            </div>

            <!-- قائمة المكونات الكاملة مع التمييز اللوني للمواد المشبوهة -->
            <h4 style="margin-top: 20px; color: var(--text-dark); font-size: 16px;" data-i18n="ingredients_title">📝 المكونات المسجلة:</h4>
            <div class="ingredients-box" id="ingredientsText"></div>

            <!-- زر لإعادة المسح -->
            <button onclick="resetScanner()" style="margin-top: 25px; width: 100%; padding: 14px; background: #64748b; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit;">
                <i class="fas fa-redo"></i> <span data-i18n="scan_again">مسح منتج آخر</span>
            </button>
        </div>
    </div>

    <script>
        // قاموس اللغات لصفحة الماسح
        const scannerTranslations = {
            ar: {
                'home': 'الرئيسية',
                'title': 'ماسح الباركود وفحص الحلال',
                'subtitle': 'امسح باركود أي منتج في السوبرماركت لمعرفة مكوناته وهل يحتوي على خنزير أو مواد مشبوهة',
                'camera_start': 'تشغيل الكاميرا',
                'camera_stop': 'إيقاف الكاميرا',
                'search': 'فحص',
                'loading': 'جاري فحص المنتج في قاعدة البيانات العالمية...',
                'nutrition_title': '📊 القيم الغذائية (لكل 100 غرام):',
                'ingredients_title': '📝 قائمة المكونات:',
                'scan_again': 'مسح منتج آخر',
                'energy': 'سعرات',
                'protein': 'بروتين',
                'carbs': 'كربوهيدرات',
                'sugars': 'سكر',
                'fat': 'دهون',
                'salt': 'ملح',
                'safe_title': 'خالٍ من مشتقات الخنزير ✔️ (Pork-Free)',
                'safe_desc': 'لم يتم العثور على أي مشتقات خنزير أو جيلاتين أو شحوم خنزير في المكونات المسجلة.',
                'danger_title': 'تنبيه: يحتوي على مشتقات الخنزير! ❌ (Contains Pork)',
                'danger_desc': 'تم اكتشاف مكونات مشتقة من الخنزير في قائمة المكونات (انظر التمييز الأحمر أدناه).',
                'warning_title': 'تنبيه: يحتوي على مواد مشبوهة تحتاج تدقيق ⚠️',
                'warning_desc': 'يحتوي المنتج على مثبتات أو جيلاتين غير محدد المصدر (قد يكون حيواني أو نباتي).',
                'not_found_title': 'المنتج غير مسجل بعد في قاعدة البيانات 🔍',
                'not_found_desc': 'لم نتمكن من العثور على بيانات هذا الباركود، يُرجى فحص ملصق المكونات يدوياً.'
            },
            en: {
                'home': 'Home',
                'title': 'Smart Barcode & Halal Scanner',
                'subtitle': 'Scan any product in the supermarket to check ingredients, pork derivatives, and nutrition',
                'camera_start': 'Start Camera',
                'camera_stop': 'Stop Camera',
                'search': 'Scan',
                'loading': 'Checking product in global database...',
                'nutrition_title': '📊 Nutrition Facts (per 100g):',
                'ingredients_title': '📝 Ingredients List:',
                'scan_again': 'Scan Another Product',
                'energy': 'Calories',
                'protein': 'Protein',
                'carbs': 'Carbs',
                'sugars': 'Sugars',
                'fat': 'Fat',
                'salt': 'Salt',
                'safe_title': 'Pork-Free / Halal Friendly ✔️',
                'safe_desc': 'No pork, pork gelatin, or lard detected in the ingredients.',
                'danger_title': 'Warning: Contains Pork Derivatives! ❌',
                'danger_desc': 'Porcine / pork ingredients were detected (see red highlights below).',
                'warning_title': 'Caution: Contains Questionable Additives ⚠️',
                'warning_desc': 'Product contains additives (e.g. E471 or unspecified gelatin) that may be animal or plant-derived.',
                'not_found_title': 'Product Not Found in Database 🔍',
                'not_found_desc': 'We could not find this barcode yet. Please check the label manually.'
            }
        };

        // الكشف التلقائي الذكي عن لغة الهاتف
        function getDeviceLanguage() {
            const saved = localStorage.getItem('preferred_language');
            if (saved === 'ar' || saved === 'en') return saved;
            const phone = (navigator.language || '').toLowerCase();
            return phone.startsWith('ar') ? 'ar' : 'en';
        }

        let currentLang = getDeviceLanguage();

        function t(key) {
            return scannerTranslations[currentLang]?.[key] || key;
        }

        function switchLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferred_language', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (scannerTranslations[lang][k]) el.textContent = scannerTranslations[lang][k];
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                const bLang = btn.getAttribute('data-lang-toggle');
                btn.classList.toggle('active', bLang === lang);
                btn.style.opacity = bLang === lang ? '1' : '0.5';
            });
            
            updateCameraBtnText();
        }

        function updateCameraBtnText() {
            const textEl = document.getElementById('cameraBtnText');
            if (html5QrCode && isScanning) {
                textEl.textContent = t('camera_stop');
            } else {
                textEl.textContent = t('camera_start');
            }
        }

        // قاموس الكلمات المشبوهة ومشتقات الخنزير بكل اللغات (هولندي، تركي، إنجليزي، عربي، ألماني، فرنسي)
        const porkKeywords = [
            // Dutch (الهولندية)
            'varken', 'varkensvlees', 'varkensvet', 'varkensgelatine', 'spek', 'reuzel', 'bacon', 'ham',
            // Turkish (التركية)
            'domuz', 'domuz eti', 'domuz yağı', 'domuz jelatini', 'domuz kıkırdağı',
            // English (الإنجليزية)
            'pork', 'porcine', 'lard', 'pork gelatin', 'pork fat', 'pig',
            // Arabic (العربية)
            'خنزير', 'لحم خنزير', 'شحم خنزير', 'دهن خنزير', 'جيلاتين خنزير',
            // German (الألمانية)
            'schwein', 'schweinefleisch', 'schweinegelatine', 'schweineschmalz', 'speck',
            // French (الفرنسية)
            'porc', 'gélatine de porc', 'saindoux', 'viande de porc'
        ];

        // الرموز والإضافات المشبوهة (قد تكون نباتية أو حيوانية)
        const suspiciousKeywords = [
            'e441', 'e120', 'carmine', 'cochineal', 'e471', 'e472', 'gelatine', 'gelatin', 'stremsel', 'rennet', 'dierlijk stremsel'
        ];

        let html5QrCode = null;
        let isScanning = false;

        function toggleCamera() {
            if (isScanning) {
                stopCamera();
            } else {
                startCamera();
            }
        }

        function startCamera() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            const config = { fps: 10, qrbox: { width: 280, height: 180 } };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
                .then(() => {
                    isScanning = true;
                    updateCameraBtnText();
                })
                .catch(err => {
                    console.error("Camera error:", err);
                    alert("تعذر فتح الكاميرا. يُرجى السماح بإذن الكاميرا أو استخدام الإدخال اليدوي.");
                });
        }

        function stopCamera() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    updateCameraBtnText();
                }).catch(err => console.error(err));
            }
        }

        function onScanSuccess(decodedText) {
            stopCamera();
            fetchProductData(decodedText);
        }

        // جلب بيانات المنتج من قاعدة البيانات العالمية
        async function fetchProductData(barcode) {
            if (!barcode || barcode.trim() === '') {
                alert('يرجى إدخال رقم باركود صحيح');
                return;
            }
            barcode = barcode.trim();

            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                const data = await response.json();

                document.getElementById('loadingSpinner').style.display = 'none';

                if (data.status === 1 && data.product) {
                    renderProductResult(data.product, barcode);
                } else {
                    renderNotFound(barcode);
                }
            } catch (error) {
                console.error('API Error:', error);
                document.getElementById('loadingSpinner').style.display = 'none';
                renderNotFound(barcode);
            }
        }

        // تحليل المكونات وعرض النتيجة بالألوان والنصوص
        function renderProductResult(product, barcode) {
            const card = document.getElementById('resultCard');
            const badge = document.getElementById('statusBadge');

            const name = product.product_name || product.product_name_en || product.product_name_nl || 'منتج غير مسمى';
            const brand = product.brands || '';
            const img = product.image_url || '/images/icon-192.png';
            
            // جمع نصوص المكونات بجميع اللغات المتوفرة
            const ingredients = (product.ingredients_text || product.ingredients_text_nl || product.ingredients_text_en || product.ingredients_text_de || '').toLowerCase();
            const additives = (product.additives_tags || []).map(a => a.toLowerCase()).join(' ');
            const combinedText = `${ingredients} ${additives}`;

            document.getElementById('productTitle').textContent = name;
            document.getElementById('productBrand').textContent = brand;
            document.getElementById('barcodeNumber').textContent = `Barcode: ${barcode}`;
            document.getElementById('productImg').src = img;

            // فحص مشتقات الخنزير
            let hasPork = false;
            let detectedPorkWord = '';
            for (let word of porkKeywords) {
                if (combinedText.includes(word)) {
                    hasPork = true;
                    detectedPorkWord = word;
                    break;
                }
            }

            // فحص المواد المشبوهة
            let hasSuspicious = false;
            let detectedSuspiciousWord = '';
            if (!hasPork) {
                for (let word of suspiciousKeywords) {
                    if (combinedText.includes(word)) {
                        hasSuspicious = true;
                        detectedSuspiciousWord = word;
                        break;
                    }
                }
            }

            // عرض الشارة والنتيجة
            if (hasPork) {
                badge.className = 'status-badge status-danger';
                badge.innerHTML = `
                    <i class="fas fa-times-circle" style="font-size: 32px;"></i>
                    <div>
                        <div>${t('danger_title')}</div>
                        <small style="font-size: 13px; font-weight: normal;">${t('danger_desc')} (المكون المكتشف: <strong>${detectedPorkWord}</strong>)</small>
                    </div>
                `;
            } else if (hasSuspicious) {
                badge.className = 'status-badge status-warning';
                badge.innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="font-size: 32px;"></i>
                    <div>
                        <div>${t('warning_title')}</div>
                        <small style="font-size: 13px; font-weight: normal;">${t('warning_desc')} (الرمز: <strong>${detectedSuspiciousWord}</strong>)</small>
                    </div>
                `;
            } else {
                badge.className = 'status-badge status-safe';
                badge.innerHTML = `
                    <i class="fas fa-check-circle" style="font-size: 32px;"></i>
                    <div>
                        <div>${t('safe_title')}</div>
                        <small style="font-size: 13px; font-weight: normal;">${t('safe_desc')}</small>
                    </div>
                `;
            }

            // عرض القيم الغذائية لكل 100 غرام
            const nutriments = product.nutriments || {};
            document.getElementById('nutriCalories').textContent = nutriments['energy-kcal_100g'] ? `${Math.round(nutriments['energy-kcal_100g'])} kcal` : '-';
            document.getElementById('nutriProtein').textContent = nutriments['proteins_100g'] ? `${nutriments['proteins_100g']} g` : '-';
            document.getElementById('nutriCarbs').textContent = nutriments['carbohydrates_100g'] ? `${nutriments['carbohydrates_100g']} g` : '-';
            document.getElementById('nutriSugars').textContent = nutriments['sugars_100g'] ? `${nutriments['sugars_100g']} g` : '-';
            document.getElementById('nutriFat').textContent = nutriments['fat_100g'] ? `${nutriments['fat_100g']} g` : '-';
            document.getElementById('nutriSalt').textContent = nutriments['salt_100g'] ? `${nutriments['salt_100g']} g` : '-';

            // تلوين الكلمات في قائمة المكونات
            let formattedIngredients = product.ingredients_text || product.ingredients_text_nl || product.ingredients_text_en || 'لم يتم تسجيل قائمة مكونات نصية لهذا المنتج.';
            
            porkKeywords.forEach(word => {
                const regex = new RegExp(`(${word})`, 'gi');
                formattedIngredients = formattedIngredients.replace(regex, '<span class="highlight-danger">$1</span>');
            });

            suspiciousKeywords.forEach(word => {
                const regex = new RegExp(`(${word})`, 'gi');
                formattedIngredients = formattedIngredients.replace(regex, '<span class="highlight-warning">$1</span>');
            });

            document.getElementById('ingredientsText').innerHTML = formattedIngredients;

            card.style.display = 'block';
            card.scrollIntoView({ behavior: 'smooth' });
        }

        function renderNotFound(barcode) {
            const card = document.getElementById('resultCard');
            const badge = document.getElementById('statusBadge');

            badge.className = 'status-badge';
            badge.style.background = '#e2e8f0';
            badge.style.color = '#334155';
            badge.style.borderRight = '6px solid #64748b';

            badge.innerHTML = `
                <i class="fas fa-question-circle" style="font-size: 32px;"></i>
                <div>
                    <div>${t('not_found_title')}</div>
                    <small style="font-size: 13px; font-weight: normal;">${t('not_found_desc')} (Barcode: ${barcode})</small>
                </div>
            `;

            document.getElementById('productTitle').textContent = 'منتج غير مسجل';
            document.getElementById('productBrand').textContent = '';
            document.getElementById('barcodeNumber').textContent = `Barcode: ${barcode}`;
            document.getElementById('productImg').src = '/images/icon-192.png';
            document.getElementById('ingredientsText').textContent = 'لا توجد مكونات مسجلة لهذا الباركود بعد.';

            ['nutriCalories', 'nutriProtein', 'nutriCarbs', 'nutriSugars', 'nutriFat', 'nutriSalt'].forEach(id => {
                document.getElementById(id).textContent = '-';
            });

            card.style.display = 'block';
            card.scrollIntoView({ behavior: 'smooth' });
        }

        function resetScanner() {
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('manualBarcodeInput').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.querySelector('.theme-toggle i');
            if (document.body.classList.contains('dark-mode')) {
                icon.className = 'fas fa-sun';
                localStorage.setItem('wibo_theme', 'dark');
            } else {
                icon.className = 'fas fa-moon';
                localStorage.setItem('wibo_theme', 'light');
            }
        }

        // تطبيق اللغة والثيم فور التحميل
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('wibo_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                const tIcon = document.querySelector('.theme-toggle i');
                if (tIcon) tIcon.className = 'fas fa-sun';
            }
            switchLanguage(currentLang);
        });
    </script>

    <!-- Mobile Menu JavaScript -->
    <script src="js/mobile-menu.js"></script>
    <!-- PWA Registration -->
    <script src="js/pwa-register.js"></script>
</body>
