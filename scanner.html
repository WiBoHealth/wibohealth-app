<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقية ماسح الباركود إلى تطبيق بودي الرسمي | WiBo Health</title>
    <meta name="description" content="تمت ترقية ماسح الباركود وفحص الحلال في WiBo Health إلى تطبيق بودي (boodi) السريري المعتمد. جاري تحويلك إلى صفحة التطبيق.">
    
    <!-- تحويل تلقائي فوري بعد ثانيتين -->
    <meta http-equiv="refresh" content="2;url=boodi.html">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #09122c 0%, #162447 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .redirect-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(16, 185, 129, 0.4);
            border-radius: 24px;
            padding: 50px 35px;
            max-width: 580px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(16, 185, 129, 0.2);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-pulse-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            50% { transform: scale(1.08); box-shadow: 0 0 30px 10px rgba(16, 185, 129, 0.2); }
        }

        .badge-upgrade {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(110, 231, 183, 0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 16px;
            color: #ffffff;
        }

        h1 span {
            color: #10b981;
        }

        p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .redirect-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            border: 2px solid #6ee7b7;
            transition: all 0.3s ease;
        }

        .redirect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.6);
        }

        .spinner-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 25px;
        }

        .spinner-line i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="redirect-card">
        <div class="icon-pulse-box">
            <i class="fa-solid fa-mobile-screen-button"></i>
        </div>

        <span class="badge-upgrade">✨ ترقية تكنولوجية كبرى</span>

        <h1>تمت ترقية ماسح الباركود إلى <span>تطبيق بودي (boodi 💚)</span></h1>

        <p>
            حرصاً على تقديم أعلى دقة سريرية وفحص فوري لمكونات الحلال والبدائل الصحية الحقيقية، تم نقل الماسح رسمياً إلى تطبيق الهاتف الذكي المعتمد من <strong>WiBo Health Group</strong>.
        </p>

        <a href="boodi.html" class="redirect-btn">
            <span>انتقل لتطبيق بودي الآن</span>
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="spinner-line">
            <i class="fa-solid fa-spinner"></i>
            <span>جاري نقلك تلقائياً خلال ثانيتين...</span>
        </div>
    </div>

    <script>
        // تحويل جافاسكريبت سريع ومباشر
        setTimeout(function() {
            window.location.href = "boodi.html";
        }, 1800);
    </script>

</body>
</html>
