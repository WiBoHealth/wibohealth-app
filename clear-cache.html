<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>مسح الكاش - WiBo Health</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease, transform 0.3s ease, top 0.3s ease, right 0.3s ease, bottom 0.3s ease, left 0.3s ease, width 0.3s ease, height 0.3s ease, max-height 0.3s ease, visibility 0.3s ease;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 مسح الكاش</h1>
        <p>اضغط على الزر لمسح جميع بيانات الكاش القديمة وإعادة تحميل الموقع بأحدث إصدار</p>
        <button onclick="clearAllCache()">مسح الكاش الآن</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        async function clearAllCache() {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = 'جاري مسح الكاش...';
            statusDiv.className = 'status';
            statusDiv.style.display = 'block';

            try {
                // 1. Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                    console.log('✅ Service Workers unregistered');
                }

                // 2. Delete all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let name of cacheNames) {
                        await caches.delete(name);
                    }
                    console.log('✅ All caches deleted');
                }

                // 3. Clear localStorage
                localStorage.clear();
                console.log('✅ localStorage cleared');

                // 4. Clear sessionStorage
                sessionStorage.clear();
                console.log('✅ sessionStorage cleared');

                // Success message
                statusDiv.textContent = '✅ تم مسح الكاش بنجاح! سيتم إعادة تحميل الصفحة...';
                statusDiv.className = 'status success';

                // Redirect to home page after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (error) {
                console.error('❌ Error clearing cache:', error);
                statusDiv.textContent = '❌ حدث خطأ: ' + error.message;
                statusDiv.className = 'status error';
            }
        }
    </script>
</body>
</html>
