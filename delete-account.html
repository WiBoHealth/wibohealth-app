    <script>
        (function (d) {
            var h = d.documentElement;
            try {
                var ok = function (x) { return x === 'ar' || x === 'en' || x === 'nl'; };
                var q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(), s = null;
                try { s = localStorage.getItem('preferred_language') || localStorage.getItem('wibo_language'); } catch (e) {}
                var n = (navigator.language || '').toLowerCase();
                var l = ok(q) ? q : ok(s) ? s : (n.indexOf('ar') === 0 ? 'ar' : n.indexOf('nl') === 0 ? 'nl' : 'en');
                h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
                if (l === 'ar') return;
                h.classList.add('lang-loading');
                var shown = false;
                var show = function () { if (!shown) { shown = true; h.classList.remove('lang-loading'); } };
                window.wiboLangReady = show;
                // the page's own translation runs in DOMContentLoaded handlers or inline scripts before it;
                // reveal right after them, before the next paint
                d.addEventListener('DOMContentLoaded', function () {
                    requestAnimationFrame(show);
                    setTimeout(show, 150);          // fallback if a frame is not painted (e.g. background tab)
                });
                setTimeout(show, 2500);             // absolute safety net
            } catch (e) { h.classList.remove('lang-loading'); }
        })(document);
    </script>

<script>
  const translations = {
    ar: {
      dir: 'rtl',
      lang: 'ar',
      btnText: 'إرسال طلب حذف الحساب عبر البريد',
      subtitle: 'WiBo Health • سياسة حذف الحساب والبيانات',
      privacy: 'سياسة الخصوصية',
      title: 'حذف الحساب والبيانات | Boodi App - WiBo Health',
      body: `
        <p>نحن في <strong>WiBo Health</strong> نحترم خصوصيتك بالكامل ونلتزم بلوائح حماية البيانات العامة (GDPR) وسياسات متجر Google Play. يمكنك طلب حذف حسابك وبياناتك المرتبطة بتطبيق <strong>بودي (Boodi)</strong> في أي وقت.</p>
        
        <h4 style="color:#fff;margin-bottom:8px;">طريقة الحذف من داخل التطبيق:</h4>
        <p>يمكنك حذف حسابك فورياً وبنقرة واحدة من داخل التطبيق: اضغط على عداد الرصيد في أعلى الشاشة ⬅️ اختر "حذف حسابي وبياناتي" ⬅️ أكّد العملية، وسيتم مسح كافة بياناتك من خوادمنا تلقائياً.</p>

        <h4 style="color:#fff;margin-bottom:8px;">طلب الحذف عبر الويب (دون فتح التطبيق):</h4>
        <p>إذا قمت بحذف التطبيق وترغب في مسح بياناتك السحابية، يرجى الضغط على الزر أدناه وإرسال بريد إلكتروني إلى <code>support@wibohealth.com</code> مع ذكر معرّف حسابك أو البريد المستخدم، وسيتم حذف كافة بياناتك بالكامل خلال 48 ساعة.</p>

        <h4 style="color:#fff;margin-bottom:8px;">ما هي البيانات التي سيتم حذفها نهائياً من خوادمنا (Supabase – ألمانيا)؟</h4>
        <ul>
          <li>ملف الحساب (معرّف الحساب والبريد الإلكتروني عند التسجيل).</li>
          <li>رصيد المسحات المكتسب.</li>
          <li>مساهمات المنتجات الغذائية والصور التي قمت برفعها.</li>
        </ul>
        <p><strong>سجل المسحات:</strong> لا يُخزَّن على خوادمنا إطلاقاً، بل يُحفظ محلياً في ذاكرة هاتفك فقط، ويُمسح تلقائياً من الهاتف عند تسجيل الخروج أو حذف الحساب.</p>

        <div class="warning-box">
          ⚠️ <strong>تنبيه هام للاشتراكات:</strong> حذف حسابك لا يلغي الاشتراكات النشطة في متجر Google Play تلقائياً. يرجى إلغاء الاشتراك من خلال حسابك في Google Play لتفادي أي خصم قادم.
        </div>
      `
    },
    nl: {
      dir: 'ltr',
      lang: 'nl',
      btnText: 'Verzoek tot accountverwijdering via e-mail',
      subtitle: 'WiBo Health • Account- en gegevensverwijdering',
      privacy: 'Privacybeleid',
      title: 'Account Verwijderen | Boodi App - WiBo Health',
      body: `
        <p>Bij <strong>WiBo Health</strong> respecteren we uw privacy volledig conform de AVG/GDPR en het Google Play-beleid. U kunt te allen tijde verzoeken om verwijdering van uw <strong>Boodi App</strong>-account en bijbehorende gegevens.</p>
        
        <h4 style="color:#fff;margin-bottom:8px;">Verwijderen binnen de app:</h4>
        <p>U kunt uw account direct verwijderen via de app: tik op de saldoteller bovenaan ➡️ kies "Mijn account en gegevens verwijderen" ➡️ bevestig. Uw gegevens worden direct gewist.</p>

        <h4 style="color:#fff;margin-bottom:8px;">Verzoek via het web (zonder app):</h4>
        <p>Heeft u de app verwijderd? Klik op de onderstaande knop of stuur een e-mail naar <code>support@wibohealth.com</code>. Wij verwerken en wissen al uw gegevens binnen 48 uur.</p>

        <h4 style="color:#fff;margin-bottom:8px;">Welke gegevens worden permanent van onze servers (Supabase – Duitsland) verwijderd?</h4>
        <ul>
          <li>Uw accountprofiel (account-ID en e-mailadres bij registratie).</li>
          <li>Uw scansaldo.</li>
          <li>Uw productbijdragen en geüploade foto's.</li>
        </ul>
        <p><strong>Scangeschiedenis:</strong> wordt nooit op onze servers opgeslagen, maar uitsluitend lokaal in het geheugen van uw telefoon, en wordt automatisch van uw telefoon gewist bij uitloggen of accountverwijdering.</p>

        <div class="warning-box">
          ⚠️ <strong>Let op:</strong> Het verwijderen van uw account beëindigt een actief Google Play-abonnement niet automatisch. Zeg uw abonnement op via Google Play om toekomstige kosten te voorkomen.
        </div>
      `
    },
    en: {
      dir: 'ltr',
      lang: 'en',
      btnText: 'Send Account Deletion Request via Email',
      subtitle: 'WiBo Health • Account & Data Deletion Policy',
      privacy: 'Privacy Policy',
      title: 'Delete Account | Boodi App - WiBo Health',
      body: `
        <p>At <strong>WiBo Health</strong>, we respect your privacy under GDPR and Google Play Developer Policies. You can request the deletion of your <strong>Boodi App</strong> account and associated data at any time.</p>
        
        <h4 style="color:#fff;margin-bottom:8px;">Delete from within the app:</h4>
        <p>You can instantly delete your account inside the app: tap your balance at the top bar ➡️ select "Delete my account and data" ➡️ confirm. All your data will be purged immediately.</p>

        <h4 style="color:#fff;margin-bottom:8px;">Web deletion request (without the app):</h4>
        <p>If you have uninstalled the app, click the button below or email <code>support@wibohealth.com</code>. We will purge all your data from our servers within 48 hours.</p>

        <h4 style="color:#fff;margin-bottom:8px;">What data is permanently deleted from our servers (Supabase – Germany)?</h4>
        <ul>
          <li>Your account profile (account ID and email address if you registered).</li>
          <li>Your scan credit balance.</li>
          <li>Your product contributions and uploaded photos.</li>
        </ul>
        <p><strong>Scan history:</strong> is never stored on our servers. It is kept only locally in your phone's memory and is automatically wiped from your phone when you log out or delete your account.</p>

        <div class="warning-box">
          ⚠️ <strong>Important Note:</strong> Deleting your account does not automatically cancel an active Google Play subscription. Please manage and cancel your subscriptions in Google Play.
        </div>
      `
    }
  };

  function setLang(lang) {
    const t = translations[lang] || translations.en;
    document.documentElement.dir = t.dir;
    document.documentElement.lang = t.lang;
    document.title = t.title;
    document.getElementById('content').innerHTML = t.body;
    document.getElementById('emailBtn').textContent = t.btnText;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('privacyLink').textContent = t.privacy;
    document.body.style.fontFamily = t.lang === 'ar' ? "'Tajawal', sans-serif" : "'Inter', sans-serif";
    document.querySelectorAll('.lang-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === t.lang);
    });
    // مزامنة اللغة مع باقي صفحات الموقع
    try {
      localStorage.setItem('preferred_language', t.lang);
      localStorage.setItem('wibo_language', t.lang);
    } catch (e) {}
  }

  // اللغة: ?lang= ثم اللغة المحفوظة في الموقع ثم لغة المتصفح
  function detectInitialLang() {
    const supported = ['ar', 'nl', 'en'];
    const param = new URLSearchParams(window.location.search).get('lang');
    if (supported.includes(param)) return param;
    try {
      const saved = localStorage.getItem('preferred_language') || localStorage.getItem('wibo_language');
      if (supported.includes(saved)) return saved;
    } catch (e) {}
    const browserLang = (navigator.language || '').toLowerCase();
    if (browserLang.startsWith('ar')) return 'ar';
    if (browserLang.startsWith('nl')) return 'nl';
    return 'en';
  }

  setLang(detectInitialLang());
</script>

</body>
